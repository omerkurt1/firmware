[env:nucleo-wb55rg]
extends = arduino_base
board = nucleo_wb55rg_p
platform = ${stm32_base.platform}
platform_packages =
  ${stm32_base.platform_packages}
  platformio/toolchain-gccarmnoneeabi@1.120301.0
board_level = extra
board_upload.maximum_size = 491520
board_upload.offset_address = 0x08000000
upload_protocol = stlink
debug_tool = stlink

build_unflags =
  ${arduino_base.build_unflags}
  -std=gnu++14
  -Os
  -DRADIOLIB_EXCLUDE_CC1101=1
  -DRADIOLIB_EXCLUDE_DIRECT_RECEIVE=1
build_flags =
  ${arduino_base.build_flags}
  -Oz
  -flto
  -Ivariants/stm32/nucleo_wb55rg
  -Isrc/platform/stm32wb
  -Isrc/platform/stm32wl
  -DGPS_WB_APP_BYTES=${env:nucleo-wb55rg.board_upload.maximum_size}
  -DHAL_RNG_MODULE_ENABLED
  -DENABLE_HWSERIALLP1
  -DPIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
  -DSERIAL_RX_BUFFER_SIZE=256
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_BLUETOOTH=1
  -DMESHTASTIC_EXCLUDE_ETHERNET=1
  -DMESHTASTIC_EXCLUDE_MQTT=1
  -DMESHTASTIC_EXCLUDE_WIFI=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_RTTTL=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_TRACEROUTE=1
  -DMESHTASTIC_EXCLUDE_TRAFFIC_MANAGEMENT=1
  -DMESHTASTIC_EXCLUDE_TZ=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DBASEUI_HAS_GAMES=0
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1

build_src_filter =
  ${arduino_base.build_src_filter}
  +<platform/stm32wb/>
  +<platform/stm32wl/STM32_LittleFS.cpp>
  +<platform/stm32wl/STM32_LittleFS_File.cpp>
  +<platform/stm32wl/littlefs/>
  -<nimble/> -<mesh/api/> -<mesh/wifi/> -<mesh/http/> -<mesh/eth/> -<mesh/raspihttp/> -<modules/esp32/> -<buzz/>

lib_deps =
  ${env.lib_deps}
  ${radiolib_base.lib_deps}
  https://github.com/meshtastic/Crypto/archive/1c817c2f27aa4593e07d0f7e13b3dbf8d980bcae.zip
